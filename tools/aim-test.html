            <style>
                #game-area {
                    position: relative;
                    width: 100%;
                    height: 400px;
                    background-color: #f0f0f0;
                    border: 2px solid #ccc;
                    cursor: crosshair;
                    overflow: hidden;
                }
                #target {
                    position: absolute;
                    width: 30px;
                    height: 30px;
                    background-color: red;
                    border-radius: 50%;
                    cursor: pointer;
                    display: none; /* Initially hidden */
                }
                .game-info {
                    display: flex;
                    justify-content: space-between;
                    margin-bottom: 20px;
                    font-size: 1.2em;
                }
            </style>
            <div class="tool-container" id="aim-test-tool">
                <div class="game-info">
                    <span>점수: <span id="score">0</span></span>
                    <span>시간: <span id="time">30</span>초</span>
                </div>
                <button id="start-aim-btn">시작</button>
                <div id="game-area">
