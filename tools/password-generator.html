                </ul>
            </nav>
        </aside>
        <main class="content">
            <h2>비밀번호 생성기</h2>
            <div class="tool-container" id="password-generator-tool">
                <div class="options">
                    <div class="option">
                        <label for="length">비밀번호 길이:</label>
                        <input type="number" id="length" value="16" min="4" max="128">
                    </div>
                    <div class="option">
                        <input type="checkbox" id="include-uppercase" checked>
                        <label for="include-uppercase">대문자 포함 (ABC)</label>
                    </div>
                    <div class="option">
                        <input type="checkbox" id="include-lowercase" checked>
                        <label for="include-lowercase">소문자 포함 (abc)</label>
                    </div>
                    <div class="option">
                        <input type="checkbox" id="include-numbers" checked>
                        <label for="include-numbers">숫자 포함 (123)</label>
                    </div>
                    <div class="option">
                        <input type="checkbox" id="include-symbols" checked>
                        <label for="include-symbols">특수문자 포함 (@#$)</label>
                    </div>
                </div>
                <button id="generate-pw-btn">비밀번호 생성</button>
                <div class="result-container">
                    <input type="text" id="password-result" readonly>
                    <button id="copy-pw-btn">복사</button>
                </div>
            </div>
        </main>
