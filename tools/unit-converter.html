            <h2>단위 변환기</h2>
            <div class="tool-container" id="unit-converter-tool">
                <div class="converter-group">
                    <label for="converter-type">종류 선택:</label>
                    <select id="converter-type">
                        <option value="length">길이</option>
                        <option value="weight">무게</option>
                        <option value="temperature">온도</option>
                    </select>
                </div>
                <div class="conversion-io">
                    <div class="input-group">
                        <input type="number" id="input-value" placeholder="값 입력">
                        <select id="input-unit"></select>
                    </div>
                    <span>=</span>
                    <div class="output-group">
                        <input type="text" id="output-value" readonly placeholder="결과">
                        <select id="output-unit"></select>
                    </div>
